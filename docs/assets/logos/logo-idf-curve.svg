<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 160" role="img" aria-labelledby="title desc">
  <title id="title">GRIDF-BR IDF curve logo concept</title>
  <desc id="desc">Three rising curves and marked durations forming an IDF symbol next to the GRIDF-BR wordmark.</desc>
  <rect width="640" height="160" rx="24" fill="#edf3f0"/>
  <g transform="translate(20 19)">
    <rect width="122" height="122" rx="22" fill="#176b78"/>
    <path d="M17 97h89M24 86V26" fill="none" stroke="#dceceb" stroke-width="4"/>
    <path d="M26 79C43 75 47 63 57 57c13-8 17-20 37-28" fill="none" stroke="#e88b3a" stroke-width="6" stroke-linecap="round"/>
    <path d="M26 88c16-3 24-11 34-11 17 0 24-10 39-22" fill="none" stroke="#fffdf8" stroke-width="4" stroke-linecap="round" opacity=".9"/>
    <circle cx="57" cy="57" r="5" fill="#fffdf8"/><circle cx="94" cy="29" r="5" fill="#e88b3a"/>
    <text x="21" y="116" fill="#fffdf8" font-family="Arial, sans-serif" font-size="13" font-weight="700">IDF</text>
  </g>
  <text x="170" y="78" fill="#16333f" font-family="Georgia, serif" font-size="52" font-weight="700">GRIDF<tspan fill="#e88b3a">-BR</tspan></text>
  <text x="173" y="112" fill="#176b78" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2">INTENSITY · DURATION · FREQUENCY</text>
</svg>
